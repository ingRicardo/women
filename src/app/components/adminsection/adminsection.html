<div class="main">
  <!-- Unified Top Bar -->
  <header class="top-bar">
    <div class="top-bar-container">
      <div class="user-greeting">
        <h3>Admin Section : {{ username }}</h3>
      </div>
      
      <div class="nav-actions">
        <button class="btn btn-public" (click)="goToPublicSection()">
          Go to Public Section
        </button>
        <button class="btn btn-logout" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </header>

  <app-users></app-users>

  <!-- Receive signal emission directly in template event handler -->
  <app-womenregister (womenData)="receivedWomen.set($event)" />

  <app-women-tabs [women]="receivedWomen()"></app-women-tabs>
</div>
