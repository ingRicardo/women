
<div >
    <div class="toptitle">
    <h1>Welcome to the Women Inventory!</h1>
    </div>
    <div class="table-container">
    <table  >
        <thead>
        <tr> 
            <th>ID</th>
            <th>Name</th>
            <th>Avatar</th>
            <th>Age</th>
            <th>Status</th>
            <th>Date Of Birth</th>
            <th>Country</th>
            <th>Race</th>
            <th>E-mail</th>
        </tr>
        </thead>
        <tbody>
        @for (item of women(); track item.id) {
            <tr>
                <td>{{item.id}}</td>
                <td>{{item.name}}</td>
                <td><img  width="50" height="50" ngSrc='{{item.avatar}}' alt="Avatar" class="avatar" priority></td>
                <td>{{item.age}}</td>
                <td>{{item.status}}</td>
                <td>{{item.dateOfBirth  }}</td>
                <td>{{item.country}}</td>
                <td>{{item.race}}</td>
                <td>{{item.email}}</td> 
            </tr>
        }@empty {
            <tr>
            <td colspan="9" class="empty-table-message">No women found.</td>
            </tr>
            <tr> <td colspan="9" class="empty-table-messagev2" >loading... </td>
            </tr>
            <tr>
                <td colspan="9"  >
                    <div class="table-spinner-container">
                    <div class="spinner"></div>
                    </div>
                    
                </td>
            </tr>
        }
        </tbody>
    </table>
    </div>
 </div>
