
<div>
<div class="toptitle">
  <h1>Welcome to the Women Inventory!</h1>
</div>

<table width="100%">
    <thead>
    <tr> 
        <td>ID</td>
        <td>Name</td>
        <td>Avatar</td>
        <td>Age</td>
        <td>Status</td>
        <td>Date Of Birth</td>
        <td>Country</td>
        <td>Race</td>
        <td>E-mail</td>
    </tr>
    </thead>
    <tbody>
    @for (item of women(); track item.id) {
        <tr>
            <td>{{item.id}}</td>
            <td>{{item.name}}</td>
            <td><img  width="100" height="100" ngSrc='{{item.avatar}}' alt="Avatar" class="avatar" priority></td>
            <td>{{item.age}}</td>
            <td>{{item.status}}</td>
            <td>{{item.dateOfBirth  }}</td>
            <td>{{item.country}}</td>
            <td>{{item.race}}</td>
            <td>{{item.email}}</td> 
        </tr>
    }@empty {
        <tr>
         <td colspan="9" class="empty-table-message">No women found.</td>
         </tr>
        <tr> <td colspan="9" class="empty-table-messagev2" >loading... </td>
        </tr>
        <tr>
            <td colspan="9"  >
                <div class="table-spinner-container">
                <div class="spinner"></div>
                </div>
                
            </td>
        </tr>
    }
    </tbody>
</table>

 </div>
