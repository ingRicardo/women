<div class="carousel-container">
  <!-- Slides Track -->
  <div class="carousel-track" [style.transform]="transformStyle()">
    @for (slide of slides; track slide.image) {
      <div class="carousel-slide">
        <img [src]="slide.image" [alt]="slide.alt" class="slide-image" />
      </div>
    }
  </div>

  <!-- Navigation Arrows -->
  <button class="nav-btn prev" (click)="prevSlide()" aria-label="Previous slide">❮</button>
  <button class="nav-btn next" (click)="nextSlide()" aria-label="Next slide">❯</button>

  <!-- Indicator Dots -->
  <div class="indicator-container">
    @for (slide of slides; track slide.image; let i = $index) {
      <button 
        class="indicator-dot" 
        [class.active]="i === currentIndex()"
        (click)="goToSlide(i)"
        [aria-label]="'Go to slide ' + (i + 1)">
      </button>
    }
  </div>
</div>
